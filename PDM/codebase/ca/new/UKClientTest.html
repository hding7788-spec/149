var ocsp_ip="";
var err_str="#";
 function _VgetnameFirst() {
	// 获取用户登录名。
	// 参数说明：ocsp_ip为OCSP地址（扩展参数，在服务端验证，此处可为空），
	// port为操作的UKey，"1"表示第一把插入的UKey，"2"表示第二把插入的UKey
	// 返回值：返回值中以”#”开头为错误，无”#”正确，正确返回用户名。
	// 如果其他系统中已经验证过口令，本应用系统就无需再让用户输入口令，可以直接取用户名，否则需要调用Vgetname验证PIN码。

	port = "1";
	ret =  VgetnameFirst(ocsp_ip, port);
	if(-1 == ret.search(err_str)) {
		alert("获取用户登录名成功，登录名为：" + ret);
		return;
	} else {
		//错误码
		alert(ret.substring(1));
	}
} 

 function _Vgetname() {
	// 获取用户登录名。
	// 参数说明：pwd为用户PIN码，ocsp_ip为OCSP地址（扩展参数，在服务端验证，此处可为空），port为操作的UKey
	// 返回值中以”#”开头为错误，无”#”正确。正确返回用户名。
	pwd="!@#123ab";
	port = "1";
	ret = Vgetname(pwd, ocsp_ip, port);
	
	if(-1 == ret.search(err_str)) {
		alert(ret);
	} else {
		//错误码
		alert(ret.substring(1));
	}	
}

	//数据做base64转换，最多传递3个参数

	str= concat(username, "", "");
	//console.log("concat(param1,param2,param3)第一次收到信息："+str);
	random_user= concat(base1, str, "");
	//console.log("concat(param1,param2,param3)第二次收到信息："+random_user);
	alert("concat成功：" + random_user);
}

 function _dataSignCertEx() {	
	if(random_user==null||random_user==undefined){
		alert("首先点击concat，对base64格式数据签名");
		return;
	}
	//对数据进行签名。（测试时，首先点击concat，对base64格式数据签名）
	indata = random_user;	//indata为要签名的数据
	port = "1";				//port为操作的UKey
	ishash = "0";			//若indata已做hash,则输入"1"；若indata未做hash,则输入"0"
	str= dataSignCertEx(indata, port, ishash);
	if(-1 == str.search(err_str)) {
		alert(str);
	} else {
		//错误码
		alert(str.substring(1));
	} 
}
