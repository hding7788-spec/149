#
# CmLogger Settings
# encoding: GB18030
#

#============================================================================
# 全局设置
#----------------------------------------------------------------------------
#[SYSTEM]
#输出日志时，如果level低于logger.level.system，日志将不允许输出
#level从高到低依次为(OFF,ERROR,WARN,INFO,DEBUG,TRACE,ALL)
logger.level.system=ALL

#如果logger没有注册时的输出等级，取值为(OFF,ERROR,WARN,INFO,DEBUG,TRACE,ALL)之一
logger.level.default=DEBUG

#日志输出文件
#logger.file=$(wt.logs.dir)$(dir.sep)logger-$DATE(yyyyMMdd-HHmm).log

#日志是否输出到标准控制台
logger.stdout=true

#日志是否输出到调用端
logger.invoker=true

#日志信息是否包含线程
logger.threadName=false

#============================================================================
# 日志项控制
#    具体包/类的日志输出等级控制，缺省情况下以logger.level.default为准，eg.
#    ext.ideal.change=INFO
#    ext.ideal.bom.listener.StandardIdealListererService=DEBUG
#----------------------------------------------------------------------------
#[LOGGER MANAGER]
d800=DEBUG