</style>
<script type="text/javascript">
	$(function(){
		changeFreamHeight();
		$(window).resize(function() {
			changeFreamHeight();
		});
	});

	function changeFreamHeight(){
		//ifream高度自适应
		//chrome浏览器兼容 需要去掉5哥像素
		var winHeight = $(window).height() - 5 + "px";
		$("#outerDiv").css({height:winHeight});
		var fream = $("iframe");
		fream.each(function(){
			this.style.height = winHeight;
		});
	}
</script>

</head>
<body>
	<div style="width:1024px;margin:0 auto;overflow-y:hidden;" id="outerDiv">
        <iframe id="ifLeft" name="freamNav" src="nav.html" width="250px" height="1200px" style="float:left;border:0;margin-right:5px;padding:0;overflow:hidden;" frameborder="no"></iframe>
        <iframe id="ifRight" name="frameDivId" src="content.html" width="769px" height="1200px" style="float:right;border:0;margin:0;padding:0;" frameborder="no"></iframe>
	</div>
</body>
