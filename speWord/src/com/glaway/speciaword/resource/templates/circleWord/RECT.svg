<?xml version="1.0" encoding="utf-8"?>
<!-- Generator: Adobe Illustrator 15.0.0, SVG Export Plug-In  -->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
	<!ENTITY ns_flows "http://ns.adobe.com/Flows/1.0/">
]>

 <#assign rWidth = 0 />
 <#assign mWidth = 0 />
 <#assign x = 0 />
 <#if text_width < 24>
 	<#assign rWidth = 24 />
 	<#assign x = 7 />
 <#else>
 	<#assign rWidth = text_width + 1 />
 	<#assign x = 1 />
 </#if>
 <#assign mWidth = rWidth + 1  />
	 
<svg version="1.1"
	 xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:a="http://ns.adobe.com/AdobeSVGViewerExtensions/3.0/"
	 x="0px" y="0px" width="${mWidth}" height="25px" viewBox="0 0 ${mWidth} 25" enable-background="new 0 0 ${mWidth} 25"
	 xml:space="preserve">
	<rect x="0" y="0" fill="none" stroke="#000000" stroke-miterlimit="10" width="${rWidth}" height="24.8"/>
	<text transform="matrix(1 0 0 1 ${x} 17.0859)" font-family="'宋体'" font-size="14">${text}</text>
</svg>
